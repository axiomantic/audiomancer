[project]
name = "audiomancer"
version = "0.1.0"
description = "MCP server for music production metadata, analysis, and generation"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "Your Name"}]
readme = "README.md"

dependencies = [
    # MCP
    "mcp>=1.0.0,<2",

    # Audio Analysis
    "essentia-tensorflow>=2.1b6.dev1110,<3",
    "librosa>=0.10.0,<0.11",
    "numpy>=1.24.0,<2",

    # Storage
    "lancedb>=0.4.0,<0.5",
    "sqlalchemy>=2.0.0,<3",

    # Generation (pinned for TensorFlow compatibility)
    "tensorflow>=2.13.0,<2.14",
    "magenta>=2.1.0,<3",
    "mido>=1.3.0,<2",
    "pretty_midi>=0.2.10,<0.3",

    # Configuration
    "pydantic>=2.0.0,<3",
    "pydantic-settings>=2.0.0,<3",
    "pyyaml>=6.0,<7",

    # CLI
    "typer>=0.9.0,<1",
    "rich>=13.0.0,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
audiomancer = "audiomancer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project]
name = "audiomancer"
version = "0.1.0"
description = "MCP server for music production metadata, analysis, and generation"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Your Name"}]
readme = "README.md"

dependencies = [
    # MCP
    "mcp>=1.25.0",

    # Audio Analysis
    "essentia-tensorflow>=2.1b6.dev1389",
    "librosa>=0.11.0",
    "numpy>=2.0.0",
    "faiss-cpu>=1.13.0",

    # Storage
    "lancedb>=0.4.0,<0.5",  # Pin to 0.4.x - newer versions have Column type changes
    "sqlalchemy>=2.0.0",

    # MIDI
    "mido>=1.3.0",
    "pretty_midi>=0.2.10",

    # Configuration
    "pydantic>=2.12.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",

    # CLI
    "typer>=0.21.0",
    "rich>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "psutil>=6.0.0",
    "ruff>=0.14.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
audiomancer = "audiomancer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]

[tool.mdformat]
wrap = 100
number = false

[tool.pyright]
# Basic mode - 0 errors achieved. Strict mode deferred (673 new errors).
# Main categories: reportUnknownVariableType (98), reportUnknownMemberType (60), reportUnusedImport (34)
typeCheckingMode = "basic"

# Python version
pythonVersion = "3.12"

# Virtual environment
venv = ".venv"

# Project structure
include = ["src"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/node_modules",
    ".git",
]

# Strict inference (even in basic mode)
strictListInference = true
strictDictionaryInference = true
strictSetInference = true

# Start lenient, upgrade to strict later
reportMissingTypeStubs = "warning"
reportUnknownParameterType = "warning"

# Stub path for local stubs
stubPath = "typings"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

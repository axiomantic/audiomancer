[project]
name = "audiomancer"
version = "0.1.0"
description = "MCP server for music production metadata, analysis, and generation"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "Your Name"}]
readme = "README.md"

dependencies = [
    # MCP
    "mcp>=1.0.0,<2",

    # Audio Analysis
    "essentia-tensorflow>=2.1b6.dev1110,<3",
    "librosa>=0.10.0,<0.11",
    "numpy>=1.24.0,<2",
    "faiss-cpu>=1.7.0",
    "tensorflow>=2.10.0,<2.13",

    # Storage
    "lancedb>=0.4.0,<0.5",
    "sqlalchemy>=2.0.0,<3",

    # MIDI
    "mido>=1.2.6,<2",
    "pretty_midi>=0.2.10,<0.3",

    # Configuration
    "pydantic>=2.0.0,<3",
    "pydantic-settings>=2.0.0,<3",
    "pyyaml>=6.0,<7",

    # CLI
    "typer>=0.9.0,<1",
    "rich>=13.0.0,<14",
]

[project.optional-dependencies]
# Generation features (requires Python 3.9 for best compatibility)
generation = [
    "magenta>=2.1.0,<3",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "psutil>=5.9.0",  # For memory usage tests
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
audiomancer = "audiomancer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]

[tool.mdformat]
wrap = 100
number = false

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

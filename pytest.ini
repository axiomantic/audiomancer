[pytest]
# Pytest configuration for audiomancer

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimal output by default, verbose on failure
addopts =
    --strict-markers
    --strict-config
    --showlocals
    --tb=short
    -ra

# Markers for organizing tests
markers =
    asyncio: Async tests (pytest-asyncio)
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may require external resources)
    slow: Slow tests (may take several seconds)
    audio: Tests that process audio files
    db: Tests that use database
    embeddings: Tests that use ML embeddings
    requires_sc: Tests that require SuperCollider
    requires_tidal: Tests that require TidalCycles

# Coverage settings (if using pytest-cov)
# addopts = --cov=audiomancer --cov-report=html --cov-report=term

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (requires pytest-timeout)
# timeout = 30
# timeout_method = thread
